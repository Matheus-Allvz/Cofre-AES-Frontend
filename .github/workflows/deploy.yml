# Antes de este workflow funcionar, cadastre em
# Settings -> Secrets and variables -> Actions os secrets:
#   FRONT_DEPLOY_SSH_HOST  (IP ou host da VPS)
#   FRONT_DEPLOY_SSH_USER  (usuario deploy)
#   FRONT_DEPLOY_SSH_KEY   (chave privada SSH correspondente)

name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.FRONT_DEPLOY_SSH_HOST }}
          username: ${{ secrets.FRONT_DEPLOY_SSH_USER }}
          key: ${{ secrets.FRONT_DEPLOY_SSH_KEY }}
          script: /home/deploy/cofre-aes-frontend/deploy.sh

name: CI

on:
  pull_request:
    branches: [empresarial]
  push:
    branches: [empresarial]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test test/unit/

  vetores:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install -r test/vetores/requirements.txt
      - run: python test/vetores/gerar_vetores.py --verificar

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # O E2E roda contra o backend da branch empresarial (já mergeado). Em fase com os
      # dois repos, o PR do FE fica vermelho aqui até o merge do PR do BE (ordem: BE primeiro).
      - uses: actions/checkout@v4
        with:
          repository: Matheus-Allvz/Cofre-AES
          ref: empresarial
          path: backend
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bash scripts/e2e-backend.sh backend
      - name: node --test test/e2e/
        run: set -a; . ./.e2e.env; set +a; node --test test/e2e/
      - name: Token de convite fora dos logs da API
        run: |
          set -a; . ./.e2e.env; set +a
          ! docker compose -p cofre-e2e logs api | grep -qF "$E2E_CONVITE_OWNER"
      # Segredos gerados no E2E (segredo TOTP, códigos TOTP e de recuperação, Recovery Keys,
      # recup_auth, token de recuperação), um por linha, gravados por test/e2e/comum.mjs.
      - name: Segredos de MFA e recuperação fora dos logs da API
        # Sem os campos de número variável ("em", "duracao_ms"): um código TOTP de 6 dígitos
        # coincidiria com os microssegundos do timestamp (ver scripts/segredos-nos-logs.mjs).
        run: docker compose -p cofre-e2e logs --no-log-prefix api | node scripts/segredos-nos-logs.mjs .e2e-sentinelas.txt
      - if: always()
        run: docker compose -p cofre-e2e logs api | tail -n 50; docker compose -p cofre-e2e down -v
